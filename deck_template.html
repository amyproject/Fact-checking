<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact-checking short videos with open models</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --base: #8a8984;
  --seq1: #d6e6f9; --seq2: #b0cff3; --seq3: #84b3ec; --seq4: #5996e2; --seq5: #2a78d6; --seq6: #1d5fb0; --seq7: #144786;
  --sup: #2a78d6; --ref: #e34948; --con: #1baf7a; --nee: #a3a29a; --warn: #f2a83b;
  --tint1: #eaf2fc; --tint2: #fdf0ea; --tint3: #e8f7f1;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #1d1d1b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.slide { position: absolute; width: 1280px; height: 720px; background: var(--page); color: var(--ink); overflow: hidden; display: none; transform-origin: center center; }
.slide.on { display: block; }
.slide header { position: absolute; left: 64px; top: 40px; right: 64px; z-index: 2; }
.kicker { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--s1); font-weight: 600; }
.slide h2 { font-size: 34px; line-height: 1.15; margin: 6px 0 0; font-weight: 650; letter-spacing: -.01em; max-width: 1100px; }
.slide .sub { font-size: 17px; color: var(--ink2); margin-top: 8px; max-width: 1050px; line-height: 1.35; }
.slide svg.layer { position: absolute; inset: 0; width: 1280px; height: 720px; }
.slide footer { position: absolute; left: 64px; right: 64px; bottom: 18px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; z-index: 2; }
.ribbon { position: absolute; top: 22px; right: -46px; transform: rotate(35deg); background: var(--ref); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .1em; padding: 5px 56px; z-index: 3; }
svg text { font-family: inherit; fill: var(--ink); }
.t-muted { fill: var(--muted); } .t-ink2 { fill: var(--ink2); }
#nav { position: fixed; bottom: 12px; right: 16px; color: #bbb; font-size: 12px; font-family: inherit; z-index: 5; user-select: none; }
#nav button { background: #333; color: #ddd; border: 0; border-radius: 6px; padding: 4px 10px; margin-left: 4px; cursor: pointer; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { background: #fff; }
  #stage { position: static; display: block; }
  .slide { display: block !important; position: relative; transform: none !important; page-break-after: always; break-after: page; }
  #nav { display: none; }
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><span id="pos"></span><button id="prev" type="button">‹</button><button id="next" type="button">›</button></div>
<script id="data" type="application/json">/*__DATA__*/{}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const NS = "http://www.w3.org/2000/svg", W = 1280, H = 720;
const R = D.runs, RO = D.roles, MOD = D.models;
const LC = { supported: "var(--sup)", refuted: "var(--ref)", conflicting: "var(--con)", not_enough_evidence: "var(--nee)" };
const LN = { supported: "supported", refuted: "refuted", conflicting: "conflicting", not_enough_evidence: "not enough evidence" };
const L4 = ["supported", "conflicting", "not_enough_evidence", "refuted"];
const TIERC = { open: "var(--base)", improved: "var(--s1)", frontier: "var(--s2)" };
const pct = (x, d = 0) => x == null || isNaN(x) ? "–" : (100 * x).toFixed(d) + "%";
const pp = x => (x >= 0 ? "+" : "−") + Math.abs(100 * x).toFixed(1) + " pp";
const sum = a => a.reduce((x, y) => x + y, 0);

function h(t, a = {}, p, x) { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) if (v != null) e.setAttribute(k, v); if (x != null) e.textContent = x; if (p) p.appendChild(e); return e; }
function s(t, a = {}, p, x) { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) if (v != null) e.setAttribute(k, v); if (x != null) e.textContent = x; if (p) p.appendChild(e); return e; }
function tip(el, text) { s("title", {}, el, text); return el; }
// wrap text into lines of ~maxW px; returns the y after the last line
function wrap(p, x, y, text, maxW, size = 14, a = {}) {
  const cw = size * (a.mono ? 0.62 : 0.53), per = Math.max(4, Math.floor(maxW / cw)), words = String(text).split(/\s+/), lines = [];
  let line = ""; words.forEach(w => { if ((line + " " + w).trim().length > per && line) { lines.push(line); line = w; } else line = (line + " " + w).trim(); }); if (line) lines.push(line);
  const lh = a.lh || size * 1.3, max = a.max || 99; lines.slice(0, max).forEach((l, i) => s("text", { x, y: y + i * lh, "font-size": size, ...a.attrs }, p, i === max - 1 && lines.length > max ? (l.includes(" ") ? l.replace(/\s*\S*$/, "…") : l.slice(0, -1) + "…") : l));
  return y + Math.min(lines.length, max) * lh;
}
function defs(svg) { const d = s("defs", {}, svg); const m = s("marker", { id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, d); s("path", { d: "M0,0L10,5L0,10z", fill: "var(--axis)" }, m); }
function arrow(p, x1, y1, x2, y2, a = {}) { return s(a.curve ? "path" : "line", a.curve ? { d: `M${x1},${y1} C${a.curve[0]},${a.curve[1]} ${a.curve[2]},${a.curve[3]} ${x2},${y2}`, fill: "none", stroke: a.color || "var(--axis)", "stroke-width": a.w || 2, "marker-end": "url(#ah)", "stroke-dasharray": a.dash } : { x1, y1, x2, y2, stroke: a.color || "var(--axis)", "stroke-width": a.w || 2, "marker-end": "url(#ah)", "stroke-dasharray": a.dash }, p); }
// a rounded box with a bold title and wrapped subtitle
function box(p, x, y, w, hh, title, sub, a = {}) {
  const g = s("g", {}, p), dark = a.dark;
  s("rect", { x, y, width: w, height: hh, rx: a.rx ?? 10, fill: a.fill || "var(--surface)", stroke: a.stroke || "var(--border)", "stroke-width": a.sw || 1, "stroke-dasharray": a.dash }, g);
  if (a.bar) s("rect", { x, y, width: 5, height: hh, rx: 2, fill: a.bar }, g);
  const ty = y + (a.ty || (sub ? 24 : hh / 2 + 6)), tx = a.center ? x + w / 2 : x + 14;
  if (a.icon) s("text", { x: tx, y: ty, "font-size": 18 }, g, a.icon);
  s("text", { x: a.icon ? tx + 26 : tx, y: ty, "font-size": a.ts || 15, "font-weight": 650, "text-anchor": a.center ? "middle" : null, style: dark ? "fill:#fff" : null }, g, title);
  if (sub) { if (a.center) s("text", { x: tx, y: ty + 20, "font-size": a.ss || 12.5, "text-anchor": "middle", style: dark ? "fill:#e8eefc" : "fill:var(--ink2)" }, g, sub); else wrap(g, tx, ty + 20, sub, w - 26, a.ss || 12.5, { attrs: { style: dark ? "fill:#e8eefc" : "fill:var(--ink2)" }, max: a.max || 4 }); }
  return g;
}
function chip(p, x, y, label, a = {}) { const w = a.w || label.length * 7 + 22, g = s("g", {}, p); s("rect", { x, y, width: w, height: 22, rx: 11, fill: a.fill || "var(--surface)", stroke: a.stroke || "var(--border)" }, g); if (a.dot) s("circle", { cx: x + 11, cy: y + 11, r: 4.5, fill: a.dot }, g); s("text", { x: x + (a.dot ? 20 : 11), y: y + 15, "font-size": 12, style: a.ink ? `fill:${a.ink}` : null }, g, label); return w; }
function legend(p, x, y, items, maxX = 1216) { let cx = x; items.forEach(([n, c, dot]) => { if (cx + 18 + n.length * 6.8 > maxX) { cx = x; y += 20; } if (dot) s("circle", { cx: cx + 6, cy: y - 4, r: 5, fill: c }, p); else s("rect", { x: cx, y: y - 10, width: 12, height: 12, rx: 3, fill: c }, p); s("text", { x: cx + 18, y, "font-size": 12.5, class: "t-ink2" }, p, n); cx += 18 + n.length * 6.8 + 18; }); }
function bigNum(p, x, y, value, label, a = {}) { s("text", { x, y, "font-size": a.size || 44, "font-weight": 700, style: a.color ? `fill:${a.color}` : null }, p, value); s("text", { x, y: y + 22, "font-size": 13, class: "t-ink2" }, p, label); }
function rbar(x0, y, w, hh, r = 4) { if (w <= 0) return ""; const rr = Math.min(r, w, hh / 2), x1 = x0 + w; return `M${x0},${y}H${x1 - rr}Q${x1},${y} ${x1},${y + rr}V${y + hh - rr}Q${x1},${y + hh} ${x1 - rr},${y + hh}H${x0}Z`; }
function stackRow(p, x, y, w, hh, parts) { const tot = sum(parts.map(q => q.n)) || 1; let cx = x; parts.forEach(q => { const ww = w * q.n / tot; if (ww <= 0) return; const g = s("g", {}, p); s("rect", { x: cx, y, width: Math.max(0, ww - 2), height: hh, rx: 3, fill: q.color }, g); if (ww > 34) s("text", { x: cx + ww / 2 - 1, y: y + hh / 2 + 4.5, "font-size": 12, "text-anchor": "middle", style: `fill:${q.ink || "#fff"}` }, g, q.label ?? pct(q.n / tot)); tip(g, `${q.name}: ${q.n}`); cx += ww; }); }
const runName = k => k && R[k] ? `${R[k].name} · ${R[k].harness}` : "–";
const colorOf = k => R[k].tier === "frontier" ? TIERC.frontier : R[k].system === "closed_book" && R[k].tier === "open" ? TIERC.open : TIERC.improved;

// ---------- slide frame ----------
const slides = [];
function slide(kicker, title, sub, draw, opts = {}) { slides.push({ kicker, title, sub, draw, opts }); }
function build(sl, i) {
  const el = h("section", { class: "slide", "aria-label": sl.title }, document.getElementById("stage"));
  const hd = h("header", {}, el); if (sl.kicker) h("div", { class: "kicker" }, hd, sl.kicker); if (sl.title) h("h2", {}, hd, sl.title); if (sl.sub) h("div", { class: "sub" }, hd, sl.sub);
  const svg = s("svg", { class: "layer", viewBox: `0 0 ${W} ${H}`, role: "img" }, el); defs(svg);
  if (sl.opts.mock && D.mock) h("div", { class: "ribbon" }, el, "MOCK DATA");
  const ft = h("footer", {}, el); h("span", {}, ft, sl.opts.foot || (sl.opts.mock && D.mock ? "Model results are from the offline mock backend: placeholders until real API keys are set." : "Short-video fact-checking · v2")); h("span", {}, ft, `${i + 1} / ${slides.length}`);
  try { sl.draw(svg, el); } catch (e) { s("text", { x: 64, y: 400, "font-size": 16, style: "fill:var(--ref)" }, svg, "Could not draw: " + e.message); console.error(e); }
  return el;
}

// ================= 1. Title =================
slide("", "", "", svg => {
  s("text", { x: 64, y: 190, "font-size": 15, "font-weight": 600, style: "fill:var(--s1);letter-spacing:.08em" }, svg, "HACKATHON SUBMISSION · FACT-CHECKING CLAIMS IN SHORT VIDEOS");
  s("text", { x: 64, y: 250, "font-size": 50, "font-weight": 700 }, svg, "Can an open model fact-check");
  s("text", { x: 64, y: 310, "font-size": 50, "font-weight": 700 }, svg, "short videos as well as a frontier model?");
  s("text", { x: 64, y: 355, "font-size": 19, class: "t-ink2" }, svg, "Transcript → claims → evidence → a 4-way verdict with the exact sentence cited");
  const opens = D.roles_cfg.evaluated.filter(k => MOD[k].tier === "open"), fr = D.roles_cfg.evaluated.filter(k => MOD[k].tier === "frontier");
  let y = 430; opens.forEach((k, i) => box(svg, 64 + i * 150, y, 138, 46, MOD[k].name, null, { ts: 13, center: true, fill: "var(--surface)" }));
  const xr = 64 + opens.length * 150 + 10;
  box(svg, xr, y - 6, 150, 58, "+ harness", "11 features", { fill: "var(--s1)", dark: true, center: true, ts: 15 });
  box(svg, xr + 165, y - 6, 150, 58, "+ fine-tune", "SFT → DPO", { fill: "var(--s1)", dark: true, center: true, ts: 15 });
  s("text", { x: xr + 340, y: y + 30, "font-size": 30, "font-weight": 700, class: "t-muted" }, svg, "vs");
  fr.forEach((k, i) => box(svg, xr + 385, y + i * 52 - 10, 160, 44, MOD[k].name, null, { ts: 13, center: true, fill: "var(--tint2)", stroke: "var(--s2)" }));
  s("text", { x: 64, y: 600, "font-size": 14, class: "t-ink2" }, svg, `${D.data.test} test claims · ${D.data.videos} YouTube videos · ${D.data.dev} dev claims · ${D.rubric.n}-check rubric · answer key by ${MOD[D.roles_cfg.gt].name} (not evaluated)`);
  if (D.mock) s("text", { x: 64, y: 628, "font-size": 14, style: "fill:var(--ref)" }, svg, "Every model result in this deck is a mock placeholder until real API keys are set. The data, rubric, pipeline and training data are real.");
}, { foot: `Generated ${D.generated}` });

// ================= 2. Why =================
slide("Why this matters", "Viral claims are spoken, and checking them is slow",
  "A fact-checker has to watch, transcribe, search, read and cite before filing a verdict. The search-and-cite part is the bottleneck, and it's the part a model can do.", svg => {
  // phone with spoken claim
  s("rect", { x: 70, y: 175, width: 230, height: 440, rx: 30, fill: "#151515" }, svg);
  s("rect", { x: 82, y: 195, width: 206, height: 400, rx: 20, fill: "#2a2a28" }, svg);
  s("circle", { cx: 185, cy: 330, r: 30, fill: "rgba(255,255,255,.15)" }, svg); s("path", { d: "M176,315 L200,330 L176,345 Z", fill: "#fff" }, svg);
  s("rect", { x: 92, y: 450, width: 186, height: 120, rx: 10, fill: "rgba(0,0,0,.55)" }, svg);
  wrap(svg, 102, 474, `“${D.example.claim}”`, 166, 13, { attrs: { style: "fill:#fff" }, max: 5 });
  s("text", { x: 185, y: 600, "font-size": 11, "text-anchor": "middle", style: "fill:#aaa" }, svg, D.example.speaker || "speaker");
  // manual workflow
  const steps = [["Watch", "▶", 0], ["Transcribe", "✎", 0], ["Find the claim", "⌕", 0], ["Search", "🔎", 1], ["Read sources", "📄", 1], ["Cite the sentence", "❝", 1], ["File verdict", "✓", 0]];
  const x0 = 360, y0 = 260, bw = 112, gap = 12;
  s("text", { x: x0, y: y0 - 40, "font-size": 14, "font-weight": 650, class: "t-ink2" }, svg, "TODAY: ALL MANUAL");
  steps.forEach(([n, ic, slow], i) => { const x = x0 + i * (bw + gap); box(svg, x, y0, bw, 70, n, null, { center: true, ts: 12, fill: slow ? "var(--tint2)" : "var(--surface)", stroke: slow ? "var(--s2)" : null, ty: 48 }); s("text", { x: x + bw / 2, y: y0 + 26, "font-size": 18, "text-anchor": "middle" }, svg, ic); if (i < steps.length - 1) arrow(svg, x + bw + 1, y0 + 35, x + bw + gap - 1, y0 + 35); });
  const sx = x0 + 3 * (bw + gap), ex = x0 + 6 * (bw + gap) - gap;
  s("path", { d: `M${sx},${y0 + 82} v10 H${ex} v-10`, fill: "none", stroke: "var(--s2)", "stroke-width": 2 }, svg);
  s("text", { x: (sx + ex) / 2, y: y0 + 114, "font-size": 15, "font-weight": 650, "text-anchor": "middle", style: "fill:var(--s2)" }, svg, "the slow part: where a model helps");
  s("text", { x: x0, y: 450, "font-size": 14, "font-weight": 650, class: "t-ink2" }, svg, "WITH THIS SYSTEM");
  const auto = [["Transcript clip", "var(--surface)"], ["Claims + questions", "var(--tint1)"], ["Evidence, cited", "var(--tint1)"], ["Verdict + confidence", "var(--tint1)"], ["Analyst reviews", "var(--surface)"]];
  auto.forEach(([n, f], i) => { const x = x0 + i * 182; box(svg, x, 470, 166, 54, n, null, { center: true, ts: 13.5, fill: f, stroke: f === "var(--tint1)" ? "var(--s1)" : null }); if (i < auto.length - 1) arrow(svg, x + 167, 497, x + 181, 497); });
  s("text", { x: x0, y: 575, "font-size": 16 }, svg, "Goal: an open model (cheap, self-hostable) that does this as well as a frontier model,");
  s("text", { x: x0, y: 598, "font-size": 16 }, svg, "measured on claims professional fact-checkers have already labeled.");
});

// ================= 3. One hard claim =================
slide("The problem, concretely", "What one claim looks like", "A real test claim: the clip, what the fact-checker asked, and the traps that make a memorised answer wrong.", svg => {
  const E = D.example;
  box(svg, 64, 150, 520, 380, "", null, { fill: "#1f1f1d", stroke: "none" });
  s("text", { x: 84, y: 180, "font-size": 12, style: "fill:#9a9a94;letter-spacing:.08em" }, svg, "TRANSCRIPT EXCERPT (90-SECOND CLIP)");
  wrap(svg, 84, 208, E.transcript.slice(0, 900) + (E.transcript.length > 900 ? "…" : ""), 480, 13, { attrs: { style: "fill:#e9e9e4" }, max: 17, lh: 18 });
  box(svg, 64, 548, 520, 80, "Claim", `“${E.claim}”`, { fill: "var(--tint1)", stroke: "var(--s1)", bar: "var(--s1)", max: 2 });
  // fact-checker side
  s("text", { x: 630, y: 170, "font-size": 13, "font-weight": 650, class: "t-ink2" }, svg, "WHAT THE FACT-CHECKER ASKED");
  let y = 186; (E.qa || []).slice(0, 3).forEach((q, i) => { box(svg, 630, y, 586, 82, (t => t.length > 80 ? t.slice(0, 79) + "…" : t)(`Q${i + 1}. ${q.q}`), q.a, { ts: 13, ss: 12, max: 2, bar: "var(--s3)" }); y += 92; });
  s("text", { x: 630, y: y + 20, "font-size": 13, "font-weight": 650, class: "t-ink2" }, svg, "VERDICT");
  chip(svg, 700, y + 6, LN[E.label4], { dot: LC[E.label4] }); s("text", { x: 830, y: y + 21, "font-size": 12.5, class: "t-ink2" }, svg, `fact-checker's rating: ${E.gold_raw}`);
  s("text", { x: 630, y: y + 60, "font-size": 13, "font-weight": 650, class: "t-ink2" }, svg, "TRAPS");
  let cx = 690; const tn = Object.fromEntries(D.traps.map(t => [t.key, t.name])); (E.traps || []).forEach(t => { cx += chip(svg, cx, y + 46, tn[t] || t, { fill: "var(--tint2)", stroke: "var(--s2)" }) + 8; });
});

// ================= 4. Traps =================
slide("The problem, across the test set", "Every claim hides traps a memorised answer falls into",
  `Trap tags on the ${D.data.test} test claims (a claim can have several). These are what the harness and fine-tune have to handle.`, svg => {
  const T = D.traps.filter(t => t.n > 0), x0 = 330, x1 = 860, y0 = 160, rh = Math.min(38, 470 / T.length), max = Math.max(...T.map(t => t.n));
  [0, .25, .5, .75, 1].forEach(f => { const v = Math.round(max * f), x = x0 + (x1 - x0) * f; s("line", { x1: x, x2: x, y1: y0 - 6, y2: y0 + T.length * rh, stroke: "var(--grid)" }, svg); s("text", { x, y: y0 + T.length * rh + 18, "font-size": 11, class: "t-muted", "text-anchor": "middle" }, svg, v); });
  T.forEach((t, i) => { const y = y0 + i * rh, w = (x1 - x0) * t.n / max, g = s("g", {}, svg); s("text", { x: x0 - 12, y: y + rh / 2 + 4, "font-size": 14, "text-anchor": "end" }, g, t.name); s("path", { d: rbar(x0, y + 5, w, rh - 12), fill: i < 3 ? "var(--s2)" : "var(--seq4)" }, g); s("text", { x: x0 + w + 8, y: y + rh / 2 + 4, "font-size": 13, "font-weight": 600 }, g, `${t.n}`); tip(g, `${t.name}: ${t.why}`); });
  T.slice(0, 3).forEach((t, i) => box(svg, 920, 160 + i * 150, 296, 134, t.name, t.why, { bar: "var(--s2)", max: 5 }));
  s("text", { x: 920, y: 630, "font-size": 13, class: "t-ink2" }, svg, `${(sum(T.map(t => t.n)) / D.data.test).toFixed(1)} traps per claim on average`);
});

// ================= 5. Environment =================
slide("The environment", "From a YouTube link to a significance test", "Everything is a script with cached inputs and outputs, so a run is reproducible and a rerun is free.", svg => {
  const cols = [
    ["Data", "var(--seq1)", [["AVeriTeC", "65 video claims (v1)"], ["ClaimReview feed", `${D.data.sources.claimreview || 0} test + ${D.data.dev} dev, YouTube only`]]],
    ["Prepare", "var(--seq1)", [["YouTube transcript", "captions, English"], ["Locate the claim", "timestamp or word overlap → 90 s clip"]]],
    ["Answer key", "var(--tint2)", [[MOD[D.roles_cfg.gt].name, `effort "${D.roles_cfg.gt_effort}": questions, sub-claims, numbers, traps`], ["Fact-checker label", "always the gold verdict"]]],
    ["Systems", "var(--tint1)", [["7 models", "4 open, 1 fine-tuned, 2 frontier"], ["× harness", "off the shelf vs frozen harness"]]],
    ["Score", "var(--tint1)", [[`${D.rubric.n} checks · 5 gates`, `${D.rubric.methods.auto || 0} automatic, ${D.rubric.methods.judge || 0} by blind judge`], ["2nd judge on 25%", `${MOD[D.roles_cfg.judge2].name} → Cohen's κ`]]],
    ["Decide", "var(--tint3)", [["Dev split", "pick features, stop rule"], ["Test split, once", "McNemar, bootstrap, Holm"]]]];
  const x0 = 64, cw = 182, gap = 15;

const els = slides.map(build);
let cur = 0;
function fit() { const sc = Math.min(innerWidth / W, innerHeight / H) * 0.98; els.forEach(e => e.style.transform = `scale(${sc})`); }
function go(i) { cur = Math.max(0, Math.min(els.length - 1, i)); els.forEach((e, j) => e.classList.toggle("on", j === cur)); document.getElementById("pos").textContent = `${cur + 1} / ${els.length}`; try { history.replaceState(null, "", "#" + (cur + 1)); } catch (e) { /* file:// */ } }
addEventListener("keydown", e => { if (["ArrowRight", "PageDown", " "].includes(e.key)) go(cur + 1); if (["ArrowLeft", "PageUp"].includes(e.key)) go(cur - 1); if (e.key === "Home") go(0); if (e.key === "End") go(els.length - 1); });
document.getElementById("prev").addEventListener("click", () => go(cur - 1)); document.getElementById("next").addEventListener("click", () => go(cur + 1));
