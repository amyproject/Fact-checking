  ['{ "label": "refuted",', '  "confidence": 0.9,', '  "subclaims": [{ "text": "...", "label": "..." }],', '  "questions": [{ "q": "...",', '      "answer": "...",', '      "citations": [{ "id": 2, "quote": "..." }] }],', '  "rationale": "2-4 sentences",', '  "citations": [...] }'].forEach((l, i) => s("text", { x: 778, y: 420 + i * 25, "font-size": 13, style: "fill:#e9e9e4;font-family:ui-monospace,Menlo,monospace" }, svg, l));
  const fr = R[RO.improved]; if (fr) s("text", { x: 64, y: 640, "font-size": 13, class: "t-ink2" }, svg, `Measured on test: ${fr.seconds.toFixed(1)} model-seconds and ${fr.calls.toFixed(1)} calls per claim${D.mock ? " (mock timings)" : ""}.`);
});

// ================= 17. Each method vs baseline and frontier =================
slide("What each method adds", "From the open baseline toward the frontier, one method at a time", "Left: GLM 5.3 as each method is added, against frontier reference lines. Right: what the same frozen harness does for every model.", svg => {
  const steps = [["Off the shelf", RO.base_off], ["+ search, questions, quote check", RO.base_rag], ["+ " + (D.frozen.flags || []).filter(f => !["retrieve", "questions", "quote_check"].includes(f)).map(f => D.features[f]?.name || f).join(" + ") || "frozen harness", RO.base_frozen], ["+ fine-tune (SFT + DPO)", RO.ft_frozen]].filter(x => x[1] && R[x[1]]);
  const x0 = 64, y0 = 170, ch = 360, cw = 600, top = Math.min(1, Math.max(.3, ...Object.values(R).map(r => r.verified)) + .08), Y = v => y0 + ch - ch * v / top;
  for (let t = 0; t <= top + 1e-9; t += top > .6 ? .2 : .1) { s("line", { x1: x0 + 40, x2: x0 + cw, y1: Y(t), y2: Y(t), stroke: "var(--grid)" }, svg); s("text", { x: x0 + 32, y: Y(t) + 4, "font-size": 11.5, "text-anchor": "end", class: "t-muted" }, svg, pct(t)); }
  const bw = (cw - 60) / steps.length; let prev = null;
  steps.forEach(([n, k], i) => { const v = R[k].verified, x = x0 + 50 + i * bw, g = s("g", {}, svg);
    if (prev == null) s("rect", { x: x + 8, y: Y(v), width: bw - 16, height: Y(0) - Y(v), rx: 4, fill: "var(--base)" }, g);
    else { const up = v >= prev; s("rect", { x: x + 8, y: Y(Math.max(v, prev)), width: bw - 16, height: Math.max(2, Math.abs(Y(v) - Y(prev))), rx: 4, fill: up ? "var(--s1)" : "var(--ref)" }, g); s("line", { x1: x - bw + 8 + bw - 16, x2: x + 8, y1: Y(prev), y2: Y(prev), stroke: "var(--axis)", "stroke-dasharray": "3 3" }, svg); }
    s("text", { x: x + bw / 2, y: Y(Math.max(v, prev ?? 0)) - 8, "font-size": 13, "font-weight": 650, "text-anchor": "middle" }, g, prev == null ? pct(v, 1) : pp(v - prev));
    wrap(g, x + 8, Y(0) + 20, n, bw - 12, 12, { max: 3 }); tip(g, `${runName(k)}: ${pct(v, 1)}`); prev = v; });
  [[RO.frontier_best, "best frontier, off the shelf", "var(--s2)"], [RO.frontier_harness, "best frontier + same harness", "var(--s2)"]].forEach(([k, n, c], i) => { if (!k || !R[k]) return; const y = Y(R[k].verified); s("line", { x1: x0 + 40, x2: x0 + cw, y1: y, y2: y, stroke: c, "stroke-width": 2, "stroke-dasharray": i ? "6 4" : null }, svg); const ly = y0 + ch + 70 + i * 22; s("line", { x1: x0 + 40, x2: x0 + 76, y1: ly - 4, y2: ly - 4, stroke: c, "stroke-width": 2, "stroke-dasharray": i ? "6 4" : null }, svg); s("text", { x: x0 + 84, y: ly, "font-size": 12.5, class: "t-ink2" }, svg, `${n}: ${pct(R[k].verified, 1)}`); });
  // dumbbells per model
  const ms = D.roles_cfg.evaluated.filter(m => R[`test/${m}/closed_book`] || R[`test/${m}/${D.frozen.name}`]), dx0 = 880, dx1 = 1190, DX = v => dx0 + (dx1 - dx0) * v / top, rh = Math.min(52, 380 / ms.length);
  s("text", { x: 720, y: y0 - 4, "font-size": 13, "font-weight": 650, class: "t-ink2" }, svg, "SAME HARNESS ON EVERY MODEL");
  ms.forEach((m, i) => { const y = y0 + 24 + i * rh, a = R[`test/${m}/closed_book`], b = R[`test/${m}/${D.frozen.name}`], c = MOD[m].tier === "frontier" ? "var(--s2)" : "var(--s1)";
    s("text", { x: 868, y: y + 4, "font-size": 12.5, "text-anchor": "end", "font-weight": MOD[m].tier === "improved" ? 650 : 400 }, svg, MOD[m].name);
    if (a && b) s("line", { x1: DX(a.verified), x2: DX(b.verified), y1: y, y2: y, stroke: c, "stroke-width": 2.5, "stroke-opacity": .6 }, svg);
    if (a) s("circle", { cx: DX(a.verified), cy: y, r: 6, fill: "var(--page)", stroke: MOD[m].tier === "frontier" ? "var(--s2)" : "var(--base)", "stroke-width": 2.5 }, svg);
    if (b) { s("circle", { cx: DX(b.verified), cy: y, r: 7, fill: c, stroke: "var(--page)", "stroke-width": 2 }, svg); if (a) s("text", { x: Math.max(DX(a.verified), DX(b.verified)) + 12, y: y + 4, "font-size": 12, "font-weight": 600 }, svg, pp(b.verified - a.verified)); } });
  legend(svg, 720, y0 + ch + 60, [["off the shelf", "var(--base)", 1], ["frozen harness", "var(--s1)", 1]]);
}, { mock: true });

// ================= 18. Significance + next =================
slide("Is it real?", "Every pre-registered comparison, corrected for multiple testing", "McNemar exact test on verified accuracy, Holm-adjusted. Green = significant gain, red = significant loss, gray = can't tell.", svg => {
  const F = D.family; if (!F.length) return;
  const lim = Math.max(.1, ...F.map(f => Math.abs(f.gap))) * 1.25, x0 = 560, x1 = 960, X = v => x0 + (x1 - x0) * (v + lim) / (2 * lim), rh = Math.min(44, 380 / F.length), y0 = 180;
  [-lim, 0, lim].forEach(t => { s("line", { x1: X(t), x2: X(t), y1: y0 - 8, y2: y0 + F.length * rh, stroke: t === 0 ? "var(--ink2)" : "var(--grid)" }, svg); s("text", { x: X(t), y: y0 + F.length * rh + 18, "font-size": 11.5, "text-anchor": "middle", class: "t-muted" }, svg, `${t > 0 ? "+" : ""}${(100 * t).toFixed(0)} pp`); });
  s("text", { x: 990, y: y0 - 14, "font-size": 12, class: "t-ink2" }, svg, "better / worse"); s("text", { x: 1110, y: y0 - 14, "font-size": 12, class: "t-ink2" }, svg, "Holm p");
  F.forEach((f, i) => { const y = y0 + i * rh + rh / 2, sig = f.holm < .05, col = !sig ? "var(--base)" : f.gap > 0 ? "var(--s3)" : "var(--ref)";
    s("text", { x: 64, y: y - 3, "font-size": 13, "font-weight": 650 }, svg, f.why); s("text", { x: 64, y: y + 13, "font-size": 12, class: "t-ink2" }, svg, `improved vs ${runName(f.b)}`);
    s("rect", { x: Math.min(X(0), X(f.gap)), y: y - 9, width: Math.abs(X(f.gap) - X(0)), height: 18, rx: 4, fill: col }, svg);
    s("text", { x: X(f.gap) + (f.gap >= 0 ? 8 : -8), y: y + 4, "font-size": 12.5, "font-weight": 600, "text-anchor": f.gap >= 0 ? "start" : "end" }, svg, pp(f.gap));
    s("text", { x: 990, y: y + 4, "font-size": 13 }, svg, `${f.better} / ${f.worse}`); s("text", { x: 1110, y: y + 4, "font-size": 13, "font-weight": sig ? 700 : 400 }, svg, f.holm >= .001 ? f.holm.toFixed(3) : f.holm.toExponential(1)); });
  const yN = y0 + F.length * rh + 50;
  s("text", { x: 64, y: yN, "font-size": 13, "font-weight": 650, class: "t-ink2" }, svg, "TO TURN THIS INTO REAL RESULTS");
  [["API keys", "Fireworks secret + OpenRouter key in .env"], ["Answer key", "12_ground_truth_v2.py"], ["Fine-tune", "17_sft_v2.py launch → SFT2_MODEL_ID"], ["Iterate", "15_iterate_v2.py (dev → freeze → test once)"], ["Present", "19_deck_v2.py regenerates this deck"]].forEach(([a, b], i) => { const x = 64 + i * 232; box(svg, x, yN + 12, 216, 64, a, b, { ts: 14, ss: 12, max: 2, bar: "var(--s1)" }); if (i < 4) arrow(svg, x + 217, yN + 44, x + 231, yN + 44); });
}, { mock: true });

// ---------- navigation ----------
const els = slides.map(build);
let cur = 0;
function fit() { const sc = Math.min(innerWidth / W, innerHeight / H) * 0.98; els.forEach(e => e.style.transform = `scale(${sc})`); }
function go(i) { cur = Math.max(0, Math.min(els.length - 1, i)); els.forEach((e, j) => e.classList.toggle("on", j === cur)); document.getElementById("pos").textContent = `${cur + 1} / ${els.length}`; try { history.replaceState(null, "", "#" + (cur + 1)); } catch (e) { /* file:// */ } }
addEventListener("keydown", e => { if (["ArrowRight", "PageDown", " "].includes(e.key)) go(cur + 1); if (["ArrowLeft", "PageUp"].includes(e.key)) go(cur - 1); if (e.key === "Home") go(0); if (e.key === "End") go(els.length - 1); });
document.getElementById("prev").addEventListener("click", () => go(cur - 1)); document.getElementById("next").addEventListener("click", () => go(cur + 1));
const fromHash = () => (parseInt(location.hash.replace(/^#\/?/, "")) || 1) - 1;
addEventListener("hashchange", () => { if (fromHash() !== cur) go(fromHash()); });
addEventListener("resize", fit); fit(); go(fromHash());
window.go = go;
</script>
